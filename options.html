<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Investigate settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">INVESTIGATE</p>
      <h1>Settings</h1>
      <p class="intro">Add your OpenAI API key to investigate highlighted text. It is stored locally in this Chrome profile.</p>
      <form>
        <label for="apiKey">OpenAI API key</label>
        <input id="apiKey" type="password" autocomplete="off" placeholder="sk-…" />
        <label for="model">Model</label>
        <input id="model" type="text" value="gpt-4.1-mini" />
        <div class="row"><button type="submit">Save settings</button><span id="status" role="status"></span></div>
      </form>
      <p class="note">Your key is sent only to OpenAI when you ask Investigate a question. Avoid using the extension on pages containing sensitive information.</p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
